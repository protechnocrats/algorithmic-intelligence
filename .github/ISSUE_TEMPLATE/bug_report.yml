name: Bug or wrong advice
description: The skill made an agent do something wrong, unsafe, or slower, or the docs are wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems: do not use this form. Follow SECURITY.md and report privately."
  - type: input
    id: version
    attributes:
      label: Skill version
      description: Release tag (for example v0.1.0) or commit.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Coding agent and model
      placeholder: "Claude Code 2.1, Haiku 5.5"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The prompt, what the agent did, and the file or rule involved if you know it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A small project or code snippet, the language and version, and any report the agent wrote.
