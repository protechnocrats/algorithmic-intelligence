name: Algorithmic Intelligence
description: Reviews each pull request for performance problems in the code it changes, in report mode, and posts one comment.
author: protechnocrats
branding:
  icon: activity
  color: purple

inputs:
  anthropic-api-key:
    description: Anthropic API key. Give this or claude-code-oauth-token, from a repository secret.
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token from `claude setup-token`, for a Claude subscription instead of an API key.
    required: false
  provider:
    description: Where the model runs. anthropic (an API key or OAuth token), bedrock (Amazon Bedrock, with AWS credentials set up earlier in the job), or vertex (Google Vertex AI, with Google credentials set up earlier in the job).
    required: false
    default: anthropic
  aws-region:
    description: AWS region for provider bedrock (empty uses AWS_REGION from the job).
    required: false
    default: ''
  vertex-project-id:
    description: Google Cloud project for provider vertex.
    required: false
    default: ''
  vertex-region:
    description: Vertex AI region for provider vertex, such as us-east5 or global.
    required: false
    default: ''
  model:
    description: Model alias or full name (empty uses Claude Code's default).
    required: false
    default: sonnet
  max-budget-usd:
    description: Stop the review once it has spent this many dollars of API usage.
    required: false
    default: '2'
  timeout-minutes:
    description: Stop the review after this many minutes.
    required: false
    default: '20'
  max-diff-kb:
    description: Diff size given to the agent; larger diffs are cut at a file boundary and the agent reads the files.
    required: false
    default: '200'
  instructions:
    description: Extra context for the reviewer, such as production input sizes and latency targets.
    required: false
    default: ''
  config-file:
    description: A file of production sizes, targets, and constraints for the reviewer, read from the base branch so a pull request cannot change it (empty disables). Added to instructions.
    required: false
    default: .github/performance-review.md
  exclude-paths:
    description: Glob patterns of files not to review, one per line or comma separated, such as generated or vendored code. `*` matches across directories, and a directory pattern covers everything under it.
    required: false
    default: ''
  require-label:
    description: Review only pull requests carrying this label (empty reviews every pull request). Add `labeled` to the workflow's pull_request types.
    required: false
    default: ''
  command-authors:
    description: Author associations whose /perf-review and /perf-review dismiss comments are obeyed.
    required: false
    default: OWNER,MEMBER,COLLABORATOR
  resolve-threads:
    description: Resolve this action's review threads on the changed lines when the finding is fixed or dismissed.
    required: false
    default: 'true'
  fail-on-severity:
    description: Fail the job when the review has a finding at or above this severity (high, medium, or low). Empty never fails it. A review that does not finish never fails it.
    required: false
    default: ''
  sarif:
    description: Also write the findings as SARIF, for github/codeql-action/upload-sarif (the sarif-file output gives its path).
    required: false
    default: 'false'
  comment:
    description: Post (and update) a pull request comment. When false, the report goes only to the job summary.
    required: false
    default: 'true'
  comment-on-clean:
    description: Post a comment when the review finds nothing. When false, a clean review goes only to the job summary (an earlier comment is updated to say its findings are gone).
    required: false
    default: 'false'
  comment-min-severity:
    description: A review whose findings are all below this severity (high, medium, or low) posts no new comment, as if clean; its findings stay in the job summary and the outputs. An existing comment is still updated.
    required: false
    default: medium
  inline-comments:
    description: Also post new findings as review comments on the changed lines they concern.
    required: false
    default: 'true'
  max-inline-comments:
    description: At most this many review comments on changed lines per push, highest severity first.
    required: false
    default: '10'
  inline-min-severity:
    description: Lowest severity posted on the changed lines (high, medium, or low); lower findings stay in the comment.
    required: false
    default: medium
  review-drafts:
    description: Review draft pull requests too.
    required: false
    default: 'false'
  allow-forks:
    description: Review pull requests from forks. Needs a pull_request_target workflow (see docs/CI.md); reviews only authors in fork-authors, or pull requests carrying fork-label.
    required: false
    default: 'false'
  fork-authors:
    description: Author associations whose fork pull requests are reviewed when allow-forks is true.
    required: false
    default: OWNER,MEMBER,COLLABORATOR
  fork-label:
    description: A label a maintainer adds to have any fork pull request reviewed when allow-forks is true (empty disables).
    required: false
    default: ''
  claude-code-version:
    description: Claude Code version to install from npm. The release's version is installed from a lockfile that checks every download's integrity hash; another version is installed without that check.
    required: false
    default: '2.1.327'
  github-token:
    description: Token used to post the comment.
    required: false
    default: ${{ github.token }}

outputs:
  status:
    description: reviewed, failed, skipped, or unchanged (the code is the same as at the last review, whose findings the counts repeat).
    value: ${{ steps.post.outputs.status || steps.unchanged.outputs.status || steps.prepare.outputs.status }}
  findings:
    description: Number of findings (empty when the review gave no machine-readable findings).
    value: ${{ steps.post.outputs.findings || steps.unchanged.outputs.findings || steps.prepare.outputs.findings }}
  high:
    description: Number of high-severity findings.
    value: ${{ steps.post.outputs.high || steps.unchanged.outputs.high || steps.prepare.outputs.high }}
  medium:
    description: Number of medium-severity findings.
    value: ${{ steps.post.outputs.medium || steps.unchanged.outputs.medium || steps.prepare.outputs.medium }}
  low:
    description: Number of low-severity findings.
    value: ${{ steps.post.outputs.low || steps.unchanged.outputs.low || steps.prepare.outputs.low }}
  clean:
    description: true when the review finished and found nothing.
    value: ${{ steps.post.outputs.clean || steps.unchanged.outputs.clean || steps.prepare.outputs.clean }}
  resolved:
    description: Number of findings from the previous review that this push resolved.
    value: ${{ steps.post.outputs.resolved }}
  sarif-file:
    description: Path of the SARIF file when sarif is true and the review gave machine-readable findings; empty otherwise.
    value: ${{ steps.post.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Prepare the review (no model credentials)
      id: prepare
      shell: bash
      env:
        AI_WORK: ${{ runner.temp }}/algorithmic-intelligence
        AI_QUIET: ${{ runner.temp }}/algorithmic-intelligence-quiet
        AI_HAS_CREDENTIALS: ${{ (inputs.anthropic-api-key != '' || inputs.claude-code-oauth-token != '' || inputs.provider == 'bedrock' || inputs.provider == 'vertex') && 'true' || 'false' }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MAX_DIFF_KB: ${{ inputs.max-diff-kb }}
        INPUT_INSTRUCTIONS: ${{ inputs.instructions }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        INPUT_REQUIRE_LABEL: ${{ inputs.require-label }}
        INPUT_COMMAND_AUTHORS: ${{ inputs.command-authors }}
        INPUT_RESOLVE_THREADS: ${{ inputs.resolve-threads }}
        INPUT_COMMENT_MIN_SEVERITY: ${{ inputs.comment-min-severity }}
        INPUT_COMMENT_ON_CLEAN: ${{ inputs.comment-on-clean }}
        INPUT_REVIEW_DRAFTS: ${{ inputs.review-drafts }}
        INPUT_ALLOW_FORKS: ${{ inputs.allow-forks }}
        INPUT_FORK_AUTHORS: ${{ inputs.fork-authors }}
        INPUT_FORK_LABEL: ${{ inputs.fork-label }}
      run: python3 -I "$GITHUB_ACTION_PATH/ci/review.py" prepare

    # A quiet review (no comment) has no comment to carry its fingerprint, so the cache keeps it.
    - name: Look for an earlier quiet review of the same code
      id: quiet
      if: steps.prepare.outputs.skip == 'false' && steps.prepare.outputs.cache-key != ''
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
      with:
        path: ${{ runner.temp }}/algorithmic-intelligence-quiet
        key: ${{ steps.prepare.outputs.cache-key }}

    - name: Code unchanged since a quiet review
      id: unchanged
      if: steps.quiet.outputs.cache-hit == 'true'
      shell: bash
      env:
        AI_QUIET: ${{ runner.temp }}/algorithmic-intelligence-quiet
      run: python3 -I "$GITHUB_ACTION_PATH/ci/review.py" unchanged

    - name: Install Claude Code (lockfile with integrity hashes)
      id: install
      if: steps.prepare.outputs.skip == 'false' && steps.quiet.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.claude-code-version }}
        DEST: ${{ runner.temp }}/algorithmic-intelligence-tools
      run: |
        set -euo pipefail
        lock="$GITHUB_ACTION_PATH/ci/npm"
        locked=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["dependencies"]["@anthropic-ai/claude-code"])' "$lock/package.json")
        rm -rf "$DEST" && mkdir -p "$DEST"
        if [ "$VERSION" = "$locked" ]; then
          cp "$lock/package.json" "$lock/package-lock.json" "$DEST/"
          npm ci --prefix "$DEST" --ignore-scripts --no-audit --no-fund
        else
          echo "::warning::claude-code-version $VERSION is not the version this release locks ($locked): installing it without the lockfile's integrity check."
          npm install --prefix "$DEST" --ignore-scripts --no-audit --no-fund --no-save "@anthropic-ai/claude-code@${VERSION}"
        fi
        # Install scripts stay off for every package; Claude Code's own postinstall, from the checked tarball, puts
        # the native binary for this platform in place of its placeholder.
        pkg="$DEST/node_modules/@anthropic-ai/claude-code"
        if [ -f "$pkg/install.cjs" ]; then (cd "$pkg" && node install.cjs); fi
        "$DEST/node_modules/.bin/claude" --version
        echo "claude=$DEST/node_modules/.bin/claude" >> "$GITHUB_OUTPUT"

    - name: Review (read-only tools, no GitHub token)
      if: steps.prepare.outputs.skip == 'false' && steps.quiet.outputs.cache-hit != 'true'
      shell: bash
      env:
        AI_WORK: ${{ runner.temp }}/algorithmic-intelligence
        AI_CLAUDE: ${{ steps.install.outputs.claude }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        GITHUB_TOKEN: ''
        GH_TOKEN: ''
        ACTIONS_RUNTIME_TOKEN: ''
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_AWS_REGION: ${{ inputs.aws-region }}
        INPUT_VERTEX_PROJECT_ID: ${{ inputs.vertex-project-id }}
        INPUT_VERTEX_REGION: ${{ inputs.vertex-region }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_BUDGET_USD: ${{ inputs.max-budget-usd }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: python3 -I "$GITHUB_ACTION_PATH/ci/review.py" run

    - name: Post the report (no model credentials)
      id: post
      if: steps.prepare.outputs.skip == 'false' && steps.quiet.outputs.cache-hit != 'true'
      shell: bash
      env:
        AI_WORK: ${{ runner.temp }}/algorithmic-intelligence
        AI_QUIET: ${{ steps.prepare.outputs.cache-key != '' && format('{0}/algorithmic-intelligence-quiet', runner.temp) || '' }}
        AI_NUMBER: ${{ steps.prepare.outputs.number }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_COMMENT_ON_CLEAN: ${{ inputs.comment-on-clean }}
        INPUT_COMMENT_MIN_SEVERITY: ${{ inputs.comment-min-severity }}
        INPUT_INLINE_COMMENTS: ${{ inputs.inline-comments }}
        INPUT_MAX_INLINE_COMMENTS: ${{ inputs.max-inline-comments }}
        INPUT_INLINE_MIN_SEVERITY: ${{ inputs.inline-min-severity }}
        INPUT_RESOLVE_THREADS: ${{ inputs.resolve-threads }}
        INPUT_SARIF: ${{ inputs.sarif }}
      run: python3 -I "$GITHUB_ACTION_PATH/ci/review.py" post

    - name: Remember a quiet review of this code
      if: steps.post.outputs.save-quiet == 'true' && steps.prepare.outputs.cache-key != ''
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
      with:
        path: ${{ runner.temp }}/algorithmic-intelligence-quiet
        key: ${{ steps.prepare.outputs.cache-key }}

    - name: Fail on findings at or above fail-on-severity
      if: inputs.fail-on-severity != ''
      shell: bash
      env:
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        AI_STATUS: ${{ steps.post.outputs.status || steps.unchanged.outputs.status || steps.prepare.outputs.status }}
        AI_HIGH: ${{ steps.post.outputs.high || steps.unchanged.outputs.high || steps.prepare.outputs.high }}
        AI_MEDIUM: ${{ steps.post.outputs.medium || steps.unchanged.outputs.medium || steps.prepare.outputs.medium }}
        AI_LOW: ${{ steps.post.outputs.low || steps.unchanged.outputs.low || steps.prepare.outputs.low }}
      run: python3 -I "$GITHUB_ACTION_PATH/ci/review.py" gate
